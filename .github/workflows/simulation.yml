name: Simulation

on:
  push:
  pull_request:

jobs:
  test:
    name: Wasteland.Sim (dotnet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull golden WRMB via Git LFS
        run: git lfs pull --include="data/golden/*.wrmb" --exclude=""

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test Wasteland.Sim.sln --configuration Release --nologo
