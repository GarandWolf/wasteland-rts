name: Simulation

on:
  push:
  pull_request:

jobs:
  test:
    name: Wasteland.Sim (dotnet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull golden WRMB and placeholder audio via Git LFS
        run: git lfs pull --include="data/golden/*.wrmb,Assets/_Project/Audio/Placeholder/*.wav" --exclude=""

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate balance data
        run: python3 tools/validate.py

      - name: Test
        run: dotnet test Wasteland.Sim.sln --configuration Release --nologo

      - name: Verify playable zip packaging
        run: bash tools/playable/test_verify_playable.sh

      - name: Guard AI integer-only and no squads
        run: |
          set -euo pipefail
          if grep -RIn -i --include='*.cs' -E 'squad' \
            Packages/com.wasteland.sim/Runtime/Ai \
            Packages/com.wasteland.sim/Runtime/World; then
            echo "AI and World code must not mention squad" >&2
            exit 1
          fi
          if grep -RIn --include='*.cs' -E '\b(float|double|Single|Double)\b' Packages/com.wasteland.sim/Runtime/Ai; then
            echo "AI code must stay integer-only (no float/double)" >&2
            exit 1
          fi
          if grep -RIn --include='*.cs' --exclude='ScenarioLoaderTests.cs' --exclude='GoldenMap*Tests.cs' \
            -E '0x1000000|\b1152921[0-9]{12}' \
            Packages/com.wasteland.sim/Runtime/Ai \
            src/Wasteland.Sim.Tests; then
            echo "AI code and tests must not embed hex or decimal territory-key literals" >&2
            exit 1
          fi
