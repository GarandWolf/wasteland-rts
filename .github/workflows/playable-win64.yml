# Optional Windows player. This workflow does not run on pull_request, so it
# is not a required pull request check. A missing Unity license skips the job
# with a notice instead of failing the other workflows.

name: Playable Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "playable-*"

jobs:
  playable-win64:
    name: StandaloneWindows64 playable zip
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless Unity license secrets are present
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${UNITY_LICENSE}" ] || [ -z "${UNITY_EMAIL}" ] || [ -z "${UNITY_PASSWORD}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping the Windows playable build: UNITY_LICENSE, UNITY_EMAIL, or UNITY_PASSWORD is not set."
            echo "This workflow is optional. It is not a required pull request check."
            echo "Add those three repository secrets to upload wasteland-rts-playable-win64.zip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.license.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS content
        if: steps.license.outputs.skip != 'true'
        run: git lfs pull

      - name: Build StandaloneWindows64
        if: steps.license.outputs.skip != 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.3.24f1

      - name: Package playable zip
        if: steps.license.outputs.skip != 'true'
        run: python3 tools/playable/package_playable_zip.py --player-dir build/StandaloneWindows64 --output dist/wasteland-rts-playable-win64.zip

      - name: Verify playable zip
        if: steps.license.outputs.skip != 'true'
        run: python3 tools/playable/verify_playable_zip.py dist/wasteland-rts-playable-win64.zip

      - name: Upload wasteland-rts-playable-win64.zip
        if: steps.license.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasteland-rts-playable-win64.zip
          path: dist/wasteland-rts-playable-win64.zip
          if-no-files-found: error
